version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # size-limit のプラグインは peer で core を完全一致指定する
      # （@size-limit/esbuild@13.0.1 → peerDependencies { "size-limit": "13.0.1" }）。
      # 1 本ずつ上がると npm ci が ERESOLVE で必ず落ちるため、major も含めて
      # 3 パッケージを 1 PR にまとめる。minor-and-patch より前に置くこと
      # （先に一致したグループが優先されるため、"*" に吸われると major が分離する）。
      size-limit:
        applies-to: version-updates
        patterns:
          - "size-limit"
          - "@size-limit/*"
        update-types:
          - "minor"
          - "patch"
          - "major"
      # minor / patch は1本の PR にまとめる（CI 緑ならそのままマージ可）
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # peer 宣言が ^4 対応するまで保留（storybook-react-i18next が ^3 まで）
      - dependency-name: "i18next-http-backend"
        update-types: ["version-update:semver-major"]
      # peer 宣言が ^10 対応するまで保留（eslint-plugin-jsx-a11y / eslint-plugin-react が ^9 まで）
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # eslint 本体を 9 に固定している間は @eslint/js の major も追随させない（バージョン整合）
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7（ネイティブコンパイラ化の大型 major）はビルドチェーン
      # （Vite / docgen / 型チェック周辺）が追随するまで保留（PR #14 は CI 全滅を確認済み）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @changesets/cli 3 は **単独で上げると赤を出さずにリリースを壊す**（2026-08-16 調査）。
      # `changesets/action@v1` は `changeset publish` の標準出力を
      # `/New tag:\s+…/` で読んで publish 済みを判定するが、cli 3.0.0 はその行を
      # 出さなくなった（"Creating git tags..." に変わった）。結果として
      # **npm publish は成功するのに published=false と判定され、git タグの push と
      # GitHub Release の作成が黙って行われなくなる**。CI は緑のまま。
      # action v2 は NDJSON の構造化出力（type: "git-tag"）で判定するので cli 3 と
      # 組でしか動かず（v2 は cli 2 を検出して v1 へ誘導する）、さらに入力名が
      # 総入れ替えになる（version → version-script / publish → publish-script ほか）。
      # 上げるときは **cli 3 + action v2 + release.yml の入力名**を同時に変えること。
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
      # FullCalendar 7 は core / react のみ stable（7.0.1）で、ScheduleView が依存する
      # plugin（timegrid / daygrid / interaction）は 7.0.0-rc.0 までしか無い（latest は 6.1.21）。
      # core/react だけ 7 に上げると plugin 6 と型不整合で壊れる（#56/#58 で確認・クローズ）。
      # plugin ラインが stable 化したら本 ignore を外し、5パッケージ一括で v7 へ移行する。
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # `changesets/action` v2 は **@changesets/cli 3 とセットでしか動かない**（T201）。
      # v2 は publish 済みパッケージを NDJSON の構造化イベント（type: "git-tag"）で
      # 受け取る仕組みに変わっており、cli 2 を検出すると v1 へ誘導して失敗する。
      # さらに入力名が総入れ替えになる（version → version-script /
      # publish → publish-script / commit → commit-message / title → pr-title、
      # cwd は削除）ので、`release.yml` を書き換えないと動かない。
      #
      # 逆向き（cli 3 + action v1）は**赤を出さずに壊れる**: v1 は publish の
      # 標準出力を `/New tag:/` で読むが cli 3 はその行を出さないため、
      # npm publish は成功したままタグと GitHub Release だけが黙って作られなくなる。
      #
      # 上げるときは **cli 3 + action v2 + release.yml の入力名**を同時に。
      # 片方だけの PR は受け取らない（2026-08-16 に #433 として実際に来た）。
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
