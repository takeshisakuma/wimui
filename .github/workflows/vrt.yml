name: Visual Regression Test

on:
  pull_request:
    paths:
      - "src/**"
      - "stories/**"
      # sandbox は `patterns-playground--default` として VRT の対象に入っているのに
      # ここに無く、**レシピを足しても VRT が 1 度も走らなかった**（#219）。
      # main のベースラインが古いまま残り、次に VRT を走らせた PR（#220）が
      # 自分と無関係な差分で落ちた。CI-6 で 3 → 6 に揃えたときの取りこぼし。
      - "sandbox/**"
      - "public/locales/**"
      - "vrt/vrt.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"
  push:
    branches: [main]
    # `pull_request` 側と同じ 6 つを見る。ソース 3 つしか見ていなかったため、
    # **VRT の設定そのものを変えた PR はマージしても main で VRT が走らなかった**
    # （#185 が `threshold` を 0.1 → 0.05 にしたとき、main では 1 本も起動していない）。
    # ベースラインと設定がずれても気付けない形だったので揃える（CI-6）。
    paths:
      - "src/**"
      - "stories/**"
      # sandbox は `patterns-playground--default` として VRT の対象に入っているのに
      # ここに無く、**レシピを足しても VRT が 1 度も走らなかった**（#219）。
      # main のベースラインが古いまま残り、次に VRT を走らせた PR（#220）が
      # 自分と無関係な差分で落ちた。CI-6 で 3 → 6 に揃えたときの取りこぼし。
      - "sandbox/**"
      - "public/locales/**"
      - "vrt/vrt.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update baseline snapshots and commit back"
        type: boolean
        default: false

# 同一ブランチの古い compare を自動キャンセル（update dispatch は別グループ）
concurrency:
  group: vrt-${{ github.head_ref || github.ref_name }}-${{ github.event.inputs.update_snapshots == 'true' && 'update' || 'compare' }}
  cancel-in-progress: true

jobs:
  vrt:
    name: VRT ${{ github.event.inputs.update_snapshots == 'true' && 'update' || 'compare' }} (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 993 stories × 2 themes を 1 ジョブで回すと 6h 上限に達するためシャーディング必須
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run VRT (compare)
        if: ${{ github.event.inputs.update_snapshots != 'true' }}
        run: npx playwright test vrt/vrt.spec.ts --shard=${{ matrix.shard }}/4

      - name: Run VRT (update snapshots)
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        # **`=all` は必須**（2026-07-31・T45）。Playwright 1.51+ の素の
        # `--update-snapshots` は既定が `changed` ＝「比較に失敗した分だけ書き戻す」で、
        # その合否は `vrt.spec.ts` の `threshold` / `maxDiffPixels` が決める。つまり
        # **閾値未満の変更はベースラインに反映されないまま残る**。T45 でページ色を
        # `#f5f5f5` → `#e5e5e5` に変えたとき、YIQ 距離 129.4 が `threshold: 0.1` の
        # 基準 352.2 を下回ったため、light 937 枚のうち **852 枚が撮り直されず**、
        # 新旧が混在したベースラインがコミットバックされた（85 枚は `disabled` の
        # 変更で閾値を超えた巻き添えで更新された）。update は「今の描画に合わせる」
        # 操作であって「差分検知」ではないので、閾値の判断を挟ませない。
        # 検知側の盲点そのものは T49 で別途扱う。
        run: npx playwright test vrt/vrt.spec.ts --update-snapshots=all --shard=${{ matrix.shard }}/4

      - name: Collect updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        run: |
          mkdir -p /tmp/snapshot-updates
          git add -A vrt/vrt.spec.ts-snapshots
          git diff --staged --name-only -- vrt/vrt.spec.ts-snapshots | while read -r f; do
            mkdir -p "/tmp/snapshot-updates/$(dirname "$f")"
            cp "$f" "/tmp/snapshot-updates/$f"
          done
          echo "changed: $(find /tmp/snapshot-updates -type f | wc -l)"

      - name: Upload updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-updates-${{ matrix.shard }}
          path: /tmp/snapshot-updates
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-diffs-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  update-gate:
    # ベースライン更新フローの品質ゲート。コミットバックは GITHUB_TOKEN push のため
    # PR head で Lint/Unit を再起動できない（GitHub の再帰防止仕様）。そこで update フロー
    # 内で lint.yml と同等の軽量ゲートを走らせ、通らなければ commit-snapshots へ進めない。
    # これがないと、token-snapshot の drift 等を含む変更でもベースラインが更新され、
    # [skip ci] のチェックレス head として main にすり抜ける（2026-07-18 T10 で実発生）。
    name: Update gate (lint & audit)
    if: ${{ github.event.inputs.update_snapshots == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: StyleLint
        run: npm run stylelint
      - name: Peer import paths
        run: npm run check:imports
      - name: Library structural audit
        run: npm run audit:lib

  commit-snapshots:
    name: Commit updated snapshots
    if: ${{ github.event.inputs.update_snapshots == 'true' }}
    needs: [vrt, update-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download updated snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: snapshot-updates-*
          merge-multiple: true
          path: .

      # 撮り直した中身の順位表をジョブサマリへ出す（T69）。
      # **この時点が唯一の測定機会**: 作業ツリーに新しい PNG、HEAD に古い PNG が
      # 揃っていて、まだコミットしていない。commit-snapshots はここまで Node を
      # 使っていないので setup-node と npm ci を足している（`sharp` は devDependency）。
      # 順位表が出せなくても撮り直し自体は成立するので `continue-on-error`。
      # ここで落として commit-back を止めるのは本末転倒。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Report what changed
        continue-on-error: true
        run: node scripts/vrt-color-shift-report.js --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vrt/vrt.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          # 品質ゲートは update-gate ジョブが update フロー内で検証済み（needs 参照）。
          # [skip ci] は付けない: squash マージ時に main の merge commit へ leak し
          # deploy.yml 等を黙ってスキップさせる（2026-07-21 実発生）ため。
          git commit -m "chore: update VRT baseline snapshots"
          TARGET="${{ github.head_ref || github.ref_name }}"
          if [ "$TARGET" = "main" ]; then
            # main は保護ブランチ（直 push 禁止＝GH006）。ベースラインは PR 経由で
            # 取り込む。required checks（Lint & Type Check / Vitest）は paths 無指定で
            # 全 PR に走るため、スナップショットのみの PR でもマージ可能になる。
            BRANCH="vrt-baseline/${{ github.run_id }}"
            git push origin "HEAD:$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update VRT baseline snapshots" \
              --body "Automated VRT baseline update from the vrt.yml update dispatch (run ${{ github.run_id }}). Snapshot-only — merge to adopt the new baselines." \
              || echo "PR already exists for $BRANCH"
          else
            # feature ブランチ（非保護）は従来どおり直 push。
            git pull --rebase origin "$TARGET"
            git push origin "HEAD:$TARGET"
          fi
