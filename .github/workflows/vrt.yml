name: Visual Regression Test

on:
  pull_request:
    paths:
      - "src/**"
      - "stories/**"
      - "public/locales/**"
      - "vrt/vrt.spec.ts"
      - "playwright.config.ts"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "stories/**"
      - "public/locales/**"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update baseline snapshots and commit back"
        type: boolean
        default: false

# 同一ブランチの古い compare を自動キャンセル（update dispatch は別グループ）
concurrency:
  group: vrt-${{ github.head_ref || github.ref_name }}-${{ github.event.inputs.update_snapshots == 'true' && 'update' || 'compare' }}
  cancel-in-progress: true

jobs:
  vrt:
    name: VRT ${{ github.event.inputs.update_snapshots == 'true' && 'update' || 'compare' }} (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 993 stories × 2 themes を 1 ジョブで回すと 6h 上限に達するためシャーディング必須
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run VRT (compare)
        if: ${{ github.event.inputs.update_snapshots != 'true' }}
        run: npx playwright test vrt/vrt.spec.ts --shard=${{ matrix.shard }}/4

      - name: Run VRT (update snapshots)
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        run: npx playwright test vrt/vrt.spec.ts --update-snapshots --shard=${{ matrix.shard }}/4

      - name: Collect updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        run: |
          mkdir -p /tmp/snapshot-updates
          git add -A vrt/vrt.spec.ts-snapshots
          git diff --staged --name-only -- vrt/vrt.spec.ts-snapshots | while read -r f; do
            mkdir -p "/tmp/snapshot-updates/$(dirname "$f")"
            cp "$f" "/tmp/snapshot-updates/$f"
          done
          echo "changed: $(find /tmp/snapshot-updates -type f | wc -l)"

      - name: Upload updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-updates-${{ matrix.shard }}
          path: /tmp/snapshot-updates
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-diffs-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  commit-snapshots:
    name: Commit updated snapshots
    if: ${{ github.event.inputs.update_snapshots == 'true' }}
    needs: vrt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download updated snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: snapshot-updates-*
          merge-multiple: true
          path: .

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vrt/vrt.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: update VRT baseline snapshots [skip ci]"
            git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
            git push
          fi
