name: Visual Regression Test

on:
  pull_request:
    paths:
      - "src/**"
      - "stories/**"
      # sandbox は `patterns-playground--default` として VRT の対象に入っているのに
      # ここに無く、**レシピを足しても VRT が 1 度も走らなかった**（#219）。
      # main のベースラインが古いまま残り、次に VRT を走らせた PR（#220）が
      # 自分と無関係な差分で落ちた。CI-6 で 3 → 6 に揃えたときの取りこぼし。
      - "sandbox/**"
      - "public/locales/**"
      - "vrt/vrt.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"
      - "scripts/ci-install-playwright.sh"
      # **Storybook の設定も撮る側の道具**（CI-8 ②・2026-08-21 に発見）。
      # `.storybook/preview.ts` は**全ストーリーが何のフォントで描かれるか**を決めるのに
      # ここに無く、フォントを足す PR で VRT / a11y / tap-target が 1 本も起動しない
      # 状態だった（この PR は `vrt/story-ready.ts` も触ったのでたまたま走っただけ）。
      # T92 と同じ型で、影響は遅れて出る ── 次に走らせた無関係な PR が落ちる。
      - ".storybook/**"
      # T92: **撮る側の道具**も対象にする。撮られる中身（`src` / `stories`）と
      # スペックしか見ていなかったため、**スクリーンショットを撮る実装そのものを
      # 差し替える PR で VRT が 1 本も起動しなかった**。
      #   - #250 は `playwright` を 1.62.0 → 1.62.1 に上げるが VRT は走らない
      #   - #272 では `playwright` と Storybook 10.5.6 が**同時に**動いた
      #     （撮る側と撮られる側の両方）。しかもベースラインを 104 枚更新した
      #     直後で、ずれたときの切り分けが最も難しいタイミングだった
      #   - #9 / #10 / #19 は `actions/checkout` / `upload-artifact` /
      #     `download-artifact` を**このファイルの中で**差し替えたのに走らない
      # 影響が出るのは遅れてから ── 次に VRT を走らせた無関係な PR が落ちる
      # （#220 が実例）。落ちた側は自分の変更を疑うので原因にたどり着けない。
      # 4 箇所（2 ファイル × 2 トリガー）の同期は `check:ci-paths` が見張る。
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vrt.yml"
  push:
    branches: [main]
    # `pull_request` 側と同じ 6 つを見る。ソース 3 つしか見ていなかったため、
    # **VRT の設定そのものを変えた PR はマージしても main で VRT が走らなかった**
    # （#185 が `threshold` を 0.1 → 0.05 にしたとき、main では 1 本も起動していない）。
    # ベースラインと設定がずれても気付けない形だったので揃える（CI-6）。
    paths:
      - "src/**"
      - "stories/**"
      # sandbox は `patterns-playground--default` として VRT の対象に入っているのに
      # ここに無く、**レシピを足しても VRT が 1 度も走らなかった**（#219）。
      # main のベースラインが古いまま残り、次に VRT を走らせた PR（#220）が
      # 自分と無関係な差分で落ちた。CI-6 で 3 → 6 に揃えたときの取りこぼし。
      - "sandbox/**"
      - "public/locales/**"
      - "vrt/vrt.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"
      - "scripts/ci-install-playwright.sh"
      # **Storybook の設定も撮る側の道具**（CI-8 ②・2026-08-21 に発見）。
      # `.storybook/preview.ts` は**全ストーリーが何のフォントで描かれるか**を決めるのに
      # ここに無く、フォントを足す PR で VRT / a11y / tap-target が 1 本も起動しない
      # 状態だった（この PR は `vrt/story-ready.ts` も触ったのでたまたま走っただけ）。
      # T92 と同じ型で、影響は遅れて出る ── 次に走らせた無関係な PR が落ちる。
      - ".storybook/**"
      # T92。**`pull_request` 側と必ず同じ内容にする** ── #185 は `push` 側だけ
      # 漏れていた事例で、2 ファイル × 2 トリガー = 4 箇所が独立に腐る。
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vrt.yml"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update baseline snapshots and commit back"
        type: boolean
        default: false
      # update が書き換える範囲を決めるときの比較の相手（T258）。既定は main。
      # 別のブランチに積んだブランチ（stacked）で update するときは、積んだ先を渡す。
      scope_base:
        description: "Base ref for deciding which baselines the update may rewrite"
        type: string
        default: "main"

# 同一ブランチの古い compare を自動キャンセル（update dispatch は別グループ）
concurrency:
  group: vrt-${{ github.head_ref || github.ref_name }}-${{ github.event.inputs.update_snapshots == 'true' && 'update' || 'compare' }}
  cancel-in-progress: true

jobs:
  vrt:
    name: VRT ${{ github.event.inputs.update_snapshots == 'true' && 'update' || 'compare' }} (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04 # T281: 描画を測るので OS を固定（latest の段階移行で OS が混ざらないよう、版は明示して意図して上げる）
    # 993 stories × 2 themes を 1 ジョブで回すと 6h 上限に達するためシャーディング必須
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        # CI-8: apt が固まると job タイムアウト（30〜60 分）まで戻ってこない。
        # 1 回あたりを縛って再試行する（中身と実測は scripts/ci-install-playwright.sh）。
        timeout-minutes: 15
        run: bash scripts/ci-install-playwright.sh

      - name: Build Storybook
        run: npm run build-storybook

      # 消えたストーリーのベースラインが残っていないか（T106）。
      # `storybook-static/index.json` が要るのでビルド後に置く。Lint ワークフローは
      # Storybook をビルドしないため、そちらには置けない。
      # シャード 1 だけで十分（4 回走らせても同じ結果を 4 回出すだけ）。
      # **compare 側だけで走らせる**: update は撮り直しでベースラインを増やす経路なので、
      # そこで落とすとコミットバック前に止まって「直しようがない赤」になる。
      - name: Orphaned baselines
        if: ${{ matrix.shard == 1 && github.event.inputs.update_snapshots != 'true' }}
        run: npm run check:vrt-orphans

      - name: Run VRT (compare)
        if: ${{ github.event.inputs.update_snapshots != 'true' }}
        run: npx playwright test vrt/vrt.spec.ts --shard=${{ matrix.shard }}/4

      # **update が書き換えてよい範囲を、ブランチの変更から決める**（T258・2026-10-04）。
      # 全量の撮り直しは、PR と無関係の絵を毎回 55〜91 枚書き換える（描画の揺れ。compare は main 版の
      # ベースラインで通る）。手で仕分けて main 版へ戻していたのを、ここで決める。
      # 決め方と割り切りは scripts/vrt-update-scope.js。**一覧が取れないときは all に倒す。**
      - name: Decide update scope
        id: scope
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_BASE: ${{ github.event.inputs.scope_base || 'main' }}
          SCOPE_HEAD: ${{ github.head_ref || github.ref_name }}
        run: |
          # compare API は 1 回に 300 ファイルまで。届いていたら「切れた」とみなして all に倒す。
          if gh api "repos/${{ github.repository }}/compare/${SCOPE_BASE}...${SCOPE_HEAD}" --jq '.files[].filename' > /tmp/vrt-changed-files.txt \
            && [ "$(wc -l < /tmp/vrt-changed-files.txt)" -lt 300 ]; then
            node scripts/vrt-update-scope.js --files /tmp/vrt-changed-files.txt --ids-out /tmp/vrt-owned-ids.txt > /tmp/vrt-scope.json
          else
            node scripts/vrt-update-scope.js --force-all "変更ファイルの一覧が取れなかった（API の失敗か、300 件以上）" --ids-out /tmp/vrt-owned-ids.txt > /tmp/vrt-scope.json
          fi
          cat /tmp/vrt-scope.json
          echo "mode=$(node -p "require('/tmp/vrt-scope.json').mode")" >> "$GITHUB_OUTPUT"
          echo "ids=$(node -p "require('/tmp/vrt-scope.json').ids")" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.shard }}" = "1" ]; then
            {
              echo "### VRT update の範囲"
              echo ""
              echo "- 比較: \`${SCOPE_BASE}...${SCOPE_HEAD}\`（変更ファイル $(wc -l < /tmp/vrt-changed-files.txt) 件）"
              echo "- 判定: \`$(cat /tmp/vrt-scope.json)\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run VRT (update snapshots — all)
        if: ${{ github.event.inputs.update_snapshots == 'true' && steps.scope.outputs.mode == 'all' }}
        # **`=all` は必須**（2026-07-31・T45）。Playwright 1.51+ の素の
        # `--update-snapshots` は既定が `changed` ＝「比較に失敗した分だけ書き戻す」で、
        # その合否は `vrt.spec.ts` の `threshold` / `maxDiffPixels` が決める。つまり
        # **閾値未満の変更はベースラインに反映されないまま残る**。T45 でページ色を
        # `#f5f5f5` → `#e5e5e5` に変えたとき、YIQ 距離 129.4 が `threshold: 0.1` の
        # 基準 352.2 を下回ったため、light 937 枚のうち **852 枚が撮り直されず**、
        # 新旧が混在したベースラインがコミットバックされた（85 枚は `disabled` の
        # 変更で閾値を超えた巻き添えで更新された）。update は「今の描画に合わせる」
        # 操作であって「差分検知」ではないので、閾値の判断を挟ませない。
        # 検知側の盲点そのものは T49 で別途扱う。
        run: npx playwright test vrt/vrt.spec.ts --update-snapshots=all --shard=${{ matrix.shard }}/4

      # scoped の 1 段目: 全量を流し、**比較に落ちた絵と新しい絵だけ**を書き換える。
      # 判定は compare と同じ比較器・同じ閾値（Playwright 自身がやる）。描画の揺れは書き換わらない。
      # `changed` だけだと閾値未満の変更が残る（上の T45）ので、PR が持つ部品は 2 段目で撮り直す。
      - name: Run VRT (update snapshots — changed only)
        if: ${{ github.event.inputs.update_snapshots == 'true' && steps.scope.outputs.mode == 'scoped' }}
        run: npx playwright test vrt/vrt.spec.ts --update-snapshots=changed --shard=${{ matrix.shard }}/4

      # scoped の 2 段目: この PR が触った部品のストーリーは、閾値未満の変更もベースラインへ入れる。
      # シャードによっては対象が 0 本になるので `--pass-with-no-tests`。
      - name: Run VRT (update snapshots — owned stories)
        if: ${{ github.event.inputs.update_snapshots == 'true' && steps.scope.outputs.mode == 'scoped' && steps.scope.outputs.ids != '0' }}
        env:
          VRT_STORY_IDS_FILE: /tmp/vrt-owned-ids.txt
        run: npx playwright test vrt/vrt.spec.ts --update-snapshots=all --pass-with-no-tests --shard=${{ matrix.shard }}/4

      - name: Collect updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        run: |
          mkdir -p /tmp/snapshot-updates
          git add -A vrt/vrt.spec.ts-snapshots
          git diff --staged --name-only -- vrt/vrt.spec.ts-snapshots | while read -r f; do
            mkdir -p "/tmp/snapshot-updates/$(dirname "$f")"
            cp "$f" "/tmp/snapshot-updates/$f"
          done
          echo "changed: $(find /tmp/snapshot-updates -type f | wc -l)"

      - name: Upload updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-updates-${{ matrix.shard }}
          path: /tmp/snapshot-updates
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-diffs-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  update-gate:
    # ベースライン更新フローの品質ゲート。コミットバックは GITHUB_TOKEN push のため
    # PR head で Lint/Unit を再起動できない（GitHub の再帰防止仕様）。そこで update フロー
    # 内で lint.yml と同等の軽量ゲートを走らせ、通らなければ commit-snapshots へ進めない。
    # これがないと、token-snapshot の drift 等を含む変更でもベースラインが更新され、
    # [skip ci] のチェックレス head として main にすり抜ける（2026-07-18 T10 で実発生）。
    name: Update gate (lint & audit)
    if: ${{ github.event.inputs.update_snapshots == 'true' }}
    runs-on: ubuntu-26.04 # T281: 描画を測るので OS を固定（latest の段階移行で OS が混ざらないよう、版は明示して意図して上げる）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: StyleLint
        run: npm run stylelint
      - name: Peer import paths
        run: npm run check:imports
      - name: Library structural audit
        run: npm run audit:lib

  commit-snapshots:
    name: Commit updated snapshots
    if: ${{ github.event.inputs.update_snapshots == 'true' }}
    needs: [vrt, update-gate]
    runs-on: ubuntu-26.04 # T281: 描画を測るので OS を固定（latest の段階移行で OS が混ざらないよう、版は明示して意図して上げる）
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download updated snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: snapshot-updates-*
          merge-multiple: true
          path: .

      # 撮り直した中身の順位表をジョブサマリへ出す（T69）。
      # **この時点が唯一の測定機会**: 作業ツリーに新しい PNG、HEAD に古い PNG が
      # 揃っていて、まだコミットしていない。commit-snapshots はここまで Node を
      # 使っていないので setup-node と npm ci を足している（`sharp` は devDependency）。
      # 順位表が出せなくても撮り直し自体は成立するので `continue-on-error`。
      # ここで落として commit-back を止めるのは本末転倒。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Report what changed
        continue-on-error: true
        run: node scripts/vrt-color-shift-report.js --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vrt/vrt.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          # 品質ゲートは update-gate ジョブが update フロー内で検証済み（needs 参照）。
          # [skip ci] は付けない: squash マージ時に main の merge commit へ leak し
          # deploy.yml 等を黙ってスキップさせる（2026-07-21 実発生）ため。
          git commit -m "chore: update VRT baseline snapshots"
          TARGET="${{ github.head_ref || github.ref_name }}"
          if [ "$TARGET" = "main" ]; then
            # main は保護ブランチ（直 push 禁止＝GH006）。ベースラインは PR 経由で
            # 取り込む。required checks（Lint & Type Check / Vitest）は paths 無指定で
            # 全 PR に走るため、スナップショットのみの PR でもマージ可能になる。
            BRANCH="vrt-baseline/${{ github.run_id }}"
            git push origin "HEAD:$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update VRT baseline snapshots" \
              --body "Automated VRT baseline update from the vrt.yml update dispatch (run ${{ github.run_id }}). Snapshot-only — merge to adopt the new baselines." \
              || echo "PR already exists for $BRANCH"
          else
            # feature ブランチ（非保護）は従来どおり直 push。
            git pull --rebase origin "$TARGET"
            git push origin "HEAD:$TARGET"
          fi
