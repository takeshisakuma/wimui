name: Tap Target Size (WCAG 2.5.8)

# 起票時は 165 ストーリー分の不足があったため手動起動だけにしていた。
# 両密度とも 0 件になったので `pull_request` を足す（2026-08-10）。
# 密度は 2 つとも 1 回の実行で見る ── compact でしか出ない不足
#（SegmentedControl・JsonViewer）と、密度に依らない不足（Popover の呼び出し口）が
# 両方あるので、片方だけでは通り抜ける。シャードは 4 本のまま。
on:
  pull_request:
    paths:
      - "src/**"
      - "stories/**"
      - "vrt/tap-target.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"
      - "scripts/ci-install-playwright.sh"
      # **Storybook の設定も撮る側の道具**（CI-8 ②・2026-08-21 に発見）。
      # `.storybook/preview.ts` は**全ストーリーが何のフォントで描かれるか**を決めるのに
      # ここに無く、フォントを足す PR で VRT / a11y / tap-target が 1 本も起動しない
      # 状態だった（この PR は `vrt/story-ready.ts` も触ったのでたまたま走っただけ）。
      # T92 と同じ型で、影響は遅れて出る ── 次に走らせた無関係な PR が落ちる。
      - ".storybook/**"
      # ハーネス側だけを変えた PR で走らない穴を作らない（a11y.yml と同じ理由）
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tap-target.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "stories/**"
      - "vrt/tap-target.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"
      - "scripts/ci-install-playwright.sh"
      # **Storybook の設定も撮る側の道具**（CI-8 ②・2026-08-21 に発見）。
      # `.storybook/preview.ts` は**全ストーリーが何のフォントで描かれるか**を決めるのに
      # ここに無く、フォントを足す PR で VRT / a11y / tap-target が 1 本も起動しない
      # 状態だった（この PR は `vrt/story-ready.ts` も触ったのでたまたま走っただけ）。
      # T92 と同じ型で、影響は遅れて出る ── 次に走らせた無関係な PR が落ちる。
      - ".storybook/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tap-target.yml"
  workflow_dispatch:
    inputs:
      density:
        description: "測る密度（空なら両方）"
        type: choice
        options: ["", "comfortable", "compact"]
        default: ""
      filter:
        description: "ストーリータイトルの絞り込み（空なら全件）"
        type: string
        default: ""

concurrency:
  # 密度もキーに入れる。入れずに comfortable と compact を続けて投げたら、
  # 後から投げた側が前のランを丸ごと殺した（cancelled は灰色なので、
  # 見に行くまで「両方測った」と思い込んだままになる）。
  group: tap-target-${{ github.ref_name }}-${{ inputs.density }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        # CI-8: apt が固まると job タイムアウト（30〜60 分）まで戻ってこない。
        # 1 回あたりを縛って再試行する（中身と実測は scripts/ci-install-playwright.sh）。
        timeout-minutes: 15
        run: bash scripts/ci-install-playwright.sh

      - name: Build Storybook
        run: npm run build-storybook

      # ゲートである以上、落ちたら赤にする。手動測定のときだけ、
      # 全シャードの数字を揃えて見たいので後続を止めない。
      - name: Measure tap targets
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DENSITY: ${{ inputs.density }}
          FILTER: ${{ inputs.filter }}
        run: npx playwright test vrt/tap-target.spec.ts --shard=${{ matrix.shard }}/4

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tap-target-${{ inputs.density || 'both' }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
