name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 連続 push（バーストマージ）時は中間デプロイをキャンセルし最新のみ公開する。
# 毎デプロイで content-hash 付き chunk が総入れ替え＋force_orphan で旧ファイル
# 削除されるため、デプロイ回数を減らすほど「開いているタブが stale chunk 404 に
# なる」機会が減る（根本の stale 対策は preview-head.html の自動リロード）。
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - run: npm run test

      - run: npm run build-storybook

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          # ビルド成果物の履歴は不要なため、常に1コミットの orphan ブランチとして
          # force push する（リポジトリ肥大化防止。過去は644コミット/約250MBが蓄積）
          force_orphan: true
