name: Release

on:
  push:
    branches: [main]
    # changeset を触る push のみ起動する。changesets の実リリース契機は必ず
    # .changeset/ を触る（changeset 追加 push = Version PR 生成、Version PR
    # マージ push = changeset 削除 = publish）。この filter が無いと、それ以外の
    # 全 main push で「changeset ゼロ＝no-op なのに release 環境の承認ゲートで
    # 待機するラン＋レビュー依頼メール」が発生し、次の本番リリースを concurrency
    # で詰まらせる原因にもなる。
    paths:
      - ".changeset/**"
  # 万一 filter で必要なリリースが漏れた場合の手動起動口（publish 前の
  # release 環境承認は引き続き必須なので安全）。
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # どちらの経路に入るかを先に決める。changesets/action 自体も同じ判定をするが、
  # **その判定はジョブが起動したあと**なので、環境ゲートを掛ける単位を分けるには
  # ここで先に見る必要がある。
  decide:
    name: Decide version or publish
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "changeset: $count 件"
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

  # Version PR を作る／更新するだけの経路。**npm には触らないので環境ゲートを
  # 掛けない。**
  #
  # 以前は publish と同じ 1 ジョブで、ジョブ単位の `environment: release` が
  # 掛かっていた。そのため **npm を触らないランまで全部が承認待ちで止まり**、
  # 承認も破棄もされないまま残った 1 本が concurrency グループを占有して、
  # 以降のリリースを無音で止めた（2026-08-08 のランが 38 時間占有し、0.18.0 の
  # 準備で発覚。待たされたランはジョブを 1 つも作らないため、チェックも通知も
  # 承認ボタンも出ない）。T116。
  version:
    name: Create Release Pull Request
    needs: decide
    if: needs.decide.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          # `publish` を渡さない ＝ この経路は publish しない。
          #
          # llms.txt はソースに package.json の version を埋め込むため、
          # `changeset version` でバージョンが上がるとコミット済みコピーが古くなる。
          # Version PR の中で再生成しないと `check:llms` が必ず落ちて
          # **リリース PR が構造的にマージ不能になる**（2026-07-26 に実際に発生）。
          # 公開される dist/llms.txt はビルド時生成なので常に正しいが、
          # GitHub Pages が配信するのはコミット済みの public/llms.txt なので、
          # ここで再生成しておかないと Pages 側の版数が古いまま残る。
          version: npm run version:packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Version PR のマージと、別 changeset 起点の version ジョブがぶつかると、
  # `changeset-release/main` が消された直後の force-push が
  # `cannot lock ref` で落ちる（T170。run 31695108794、2026-08-13）。
  #
  # concurrency は別の workflow run 同士しか直列化しない。ぶつかる相手は
  # **人間が Version PR をマージした操作**なので、ここでは効かない。
  #
  # 危ないのは「最後の run がこれで落ちた場合」。`on.push.paths` は
  # `.changeset/**` しか見ないので、次に changeset が載るまで Version PR が
  # 作られず、main に消化されない changeset が無音で残る。今回は直後の
  # Version PR マージ起点 run が拾ったので偶然直った。
  #
  # このジョブは version が落ちたときだけ、**トリガーの SHA ではなく
  # いまの main** を取り直す。トリガー SHA には、並行してマージされた
  # Version PR が既に消化した changeset が残っているので、それを使うと
  # 公開済みの版を Version PR に載せ直す。
  #
  # `environment: release` は付けない。NPM_TOKEN も渡さない。
  # `publish:` も渡さない。取り残しを Version PR にするだけで、npm には触らない。
  recover-version:
    name: Recover Version PR after ref race
    needs: [decide, version]
    if: ${{ always() && needs.version.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 並行マージが default branch に見えるまでの短い待ち。失敗の原因そのもの
      # （ブランチ削除）は既に起きているので、長く待つ必要は無い。
      - name: Wait for concurrent Version PR merge to land
        run: sleep 15

      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Count leftover changesets
        id: leftover
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "changeset: $count 件"
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to recover
        if: steps.leftover.outputs.has_changesets == 'false'
        run: |
          echo "latest main に changeset が残っていない。Version PR のマージが消費したので、この失敗は取り残しを作っていない。"

      - name: Setup Node.js
        if: steps.leftover.outputs.has_changesets == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        if: steps.leftover.outputs.has_changesets == 'true'
        run: npm ci --ignore-scripts

      - name: Recreate Release Pull Request
        if: steps.leftover.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        with:
          # version ジョブと同じ。`publish` は渡さない。
          version: npm run version:packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 実際に npm へ出す経路だけを `release` 環境で守る。NPM_TOKEN もここだけ。
  publish:
    name: Publish to npm
    needs: decide
    if: needs.decide.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    # publish 用 Secret（NPM_TOKEN）はこの Environment に置く。GitHub 側で
    # `release` Environment に required reviewer を設定すると、publish 前に
    # 手動承認が必須になる（悪意ある PR による NPM_TOKEN 流出への耐性）。
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node の registry-url が生成する .npmrc は NODE_AUTH_TOKEN を
          # 参照するため、これがないと npm publish が E404 で失敗する
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance を有効化（id-token: write と組で機能）。公開物に
          # 「この GitHub リポジトリの該当 commit / Actions で作られた」ことの
          # 証明が付き、npm ページに Provenance バッジが出る＝なりすまし publish
          # ・改ざんを消費者が検証できる。公開リポジトリ + public パッケージが前提。
          NPM_CONFIG_PROVENANCE: "true"
