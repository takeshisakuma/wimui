name: Release

on:
  push:
    branches: [main]
    # changeset を触る push のみ起動する。changesets の実リリース契機は必ず
    # .changeset/ を触る（changeset 追加 push = Version PR 生成、Version PR
    # マージ push = changeset 削除 = publish）。この filter が無いと、それ以外の
    # 全 main push で「changeset ゼロ＝no-op なのに release 環境の承認ゲートで
    # 待機するラン＋レビュー依頼メール」が発生し、次の本番リリースを concurrency
    # で詰まらせる原因にもなる。
    paths:
      - ".changeset/**"
  # 万一 filter で必要なリリースが漏れた場合の手動起動口（publish 前の
  # release 環境承認は引き続き必須なので安全）。
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    # publish 用 Secret（NPM_TOKEN）はこの Environment に置く。GitHub 側で
    # `release` Environment に required reviewer を設定すると、publish 前に
    # 手動承認が必須になる（悪意ある PR による NPM_TOKEN 流出への耐性）。
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # changeset がある場合はバージョンアップ PR を作成し、
      # バージョンアップコミットが main にマージされたら npm へ publish する
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node の registry-url が生成する .npmrc は NODE_AUTH_TOKEN を
          # 参照するため、これがないと npm publish が E404 で失敗する
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance を有効化（id-token: write と組で機能）。公開物に
          # 「この GitHub リポジトリの該当 commit / Actions で作られた」ことの
          # 証明が付き、npm ページに Provenance バッジが出る＝なりすまし publish
          # ・改ざんを消費者が検証できる。公開リポジトリ + public パッケージが前提。
          NPM_CONFIG_PROVENANCE: "true"
