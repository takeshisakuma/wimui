name: Unit Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        # vite.config.ts の test.coverage.thresholds (80%) を下回ると失敗する
        run: npx vitest run --coverage --config vite.config.ts --reporter=verbose
