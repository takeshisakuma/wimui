name: Accessibility (axe-core)

on:
  pull_request:
    paths:
      - "src/**"
      - "stories/**"
      - "public/locales/**"
      - "vrt/a11y.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"
  push:
    branches: [main]
    # CI-6 と同じ非対称がここにも残っていた（CI-6 は `vrt.yml` だけを直した）。
    # ハーネス側（`vrt/a11y.spec.ts` / `vrt/story-ready.ts` / `playwright.config.ts`）を
    # 変えた PR は、マージしても main で a11y が一度も走らない状態だったので揃える。
    paths:
      - "src/**"
      - "stories/**"
      - "public/locales/**"
      - "vrt/a11y.spec.ts"
      - "vrt/story-ready.ts"
      - "playwright.config.ts"

# 同一ブランチの古いランを自動キャンセル
concurrency:
  group: a11y-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  a11y:
    name: WCAG 2.1 AA (axe-core) (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 単一ジョブだと約35分かかるためシャーディング（VRT と同構成）
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 「名前どおりに読めるか」は契約検査・VRT・axe のどれも見ない層（T79）。
      # 対になっているべきアイコンが対かを、描画して確かめる。ブラウザが要るので
      # `audit:lib`（Lint ワークフロー・ブラウザ無し）ではなくここに置く。
      # シャード 1 でだけ走らせる（4 回やっても同じ結果になる）。
      - name: Check icon mirror pairs
        if: matrix.shard == 1
        run: npm run check:icons:mirror

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run axe-core accessibility tests
        run: npx playwright test vrt/a11y.spec.ts --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
