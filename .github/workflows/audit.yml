name: Dependency Audit

# サプライチェーン対策。依存に high 以上の既知脆弱性が入ったら落とす。
# 依存が変わる PR と、週次（新規公表の脆弱性を拾う）で実行。
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
  schedule:
    # 毎週月曜 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts
      # 監査対象は「公開物に載る依存」= production 依存のみ（--omit=dev）。
      # 本パッケージは files:["dist"] で dev ツール（eslint / storybook / postcss 等）は
      # 出荷されず、その推移的 advisory は npm の range 集約（例: brace-expansion を
      # <=5.0.7 と集約しパッチ済み版まで脆弱扱い）で恒常的な false positive を生み、
      # かつ major override は caller 互換を壊すため綺麗に潰せない。dev ツールの脆弱性は
      # Dependabot と lockfile レビューで別途対応する。
      # high / critical があれば非0終了して落とす。moderate 以下は許容。必要なら --audit-level を上げる。
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      # 上限の無い optional peer レンジ（`>=12.0.0` など）に、**検証していない major が
      # 出ていないか**を見る。2026-09-12 に一度発火した実例が動機 ── `@fullcalendar/*` を
      # `>=6.0.0` と宣言したまま FullCalendar 7 が出ており、**実在するのに動かない major**を
      # 公開契約で許容していた（#598）。
      #
      # **PR では走らせない。** 鳴る条件は「上流が major を出した」であって、その PR とは
      # 無関係だから（AGENTS.md の「変更と無関係に見える赤」）。週次と手動起動のときだけ動かす。
      - name: 検証していない peer major が出ていないか（週次のみ）
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: npm run check:peer-majors
