name: i18n Check

on:
  push:
    branches: [main]
    paths:
      - "public/locales/**"
      - "src/**/*.tsx"
      - "src/**/*.ts"
      - "docs/**"
      - "stories/**"
      - "scripts/check-i18n.js"
      - "scripts/check-i18n-components.js"
      - "scripts/check-i18n-quality.js"
      - "scripts/check-i18n-ignore.js"
      - "scripts/check-mdx-hardcoded.js"
      - "scripts/check-stories-hardcoded.js"
      - "scripts/check_stories_keys.js"
      - "scripts/sync-i18n.js"
  pull_request:
    paths:
      - "public/locales/**"
      - "src/**/*.tsx"
      - "src/**/*.ts"
      - "docs/**"
      - "stories/**"
      - "scripts/check-i18n.js"
      - "scripts/check-i18n-components.js"
      - "scripts/check-i18n-quality.js"
      - "scripts/check-i18n-ignore.js"
      - "scripts/check-mdx-hardcoded.js"
      - "scripts/check-stories-hardcoded.js"
      - "scripts/check_stories_keys.js"
      - "scripts/sync-i18n.js"

jobs:
  check-translations:
    name: Check translation key consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check translation key consistency (locale vs locale)
        run: npm run i18n:check

      - name: Check translation keys used in components
        run: npm run i18n:check:components

      - name: Check i18n:sync is up to date
        run: |
          npm run i18n:sync
          git diff --exit-code public/locales/ || (echo "::error::Run \`npm run i18n:sync\` and commit the result." && exit 1)

      - name: Check translation quality (duplicate keys / PT-PT vocabulary)
        run: npm run i18n:quality

      - name: Fail on untranslated placeholders
        run: |
          matches=$(grep -r "\[MISSING_TRANSLATION" public/locales/ --include="*.json" || true)
          if [ -n "$matches" ]; then
            echo "::error::Untranslated [MISSING_TRANSLATION] values found. Run \`npm run i18n:missing\` / \`npm run i18n:sync\` and commit."
            echo "$matches"
            exit 1
          fi
          echo "✓ No [MISSING_TRANSLATION] placeholders."

      - name: i18n-ignore ratchet
        run: npm run i18n:check:ignore

      - name: Story/docs key references
        run: npm run check:stories
