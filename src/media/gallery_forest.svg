<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#BDE0F0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A7C3F"/>
      <stop offset="100%" stop-color="#2D5A1B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <rect y="310" width="400" height="90" fill="url(#ground)"/>
  <!-- Back trees (lighter, smaller) -->
  <polygon points="40,270 70,160 100,270" fill="#3A6B2A" opacity="0.7"/>
  <polygon points="90,280 120,170 150,280" fill="#4A7C3F" opacity="0.7"/>
  <polygon points="280,270 310,155 340,270" fill="#3A6B2A" opacity="0.7"/>
  <polygon points="330,280 360,165 390,280" fill="#4A7C3F" opacity="0.7"/>
  <!-- Front trees (darker, larger) -->
  <polygon points="-10,320 40,170 90,320" fill="#2D5A1B"/>
  <polygon points="60,330 120,160 180,330" fill="#3A6B2A"/>
  <polygon points="150,325 210,150 270,325" fill="#2D5A1B"/>
  <polygon points="240,330 300,165 360,330" fill="#3A6B2A"/>
  <polygon points="320,320 370,175 420,320" fill="#2D5A1B"/>
  <!-- Tree trunks -->
  <rect x="36" y="305" width="8" height="25" fill="#5C3A1E"/>
  <rect x="116" y="310" width="8" height="20" fill="#5C3A1E"/>
  <rect x="206" y="308" width="8" height="22" fill="#5C3A1E"/>
  <rect x="296" y="310" width="8" height="20" fill="#5C3A1E"/>
  <rect x="366" y="305" width="8" height="25" fill="#5C3A1E"/>
  <!-- Sunlight ray effect -->
  <circle cx="200" cy="60" r="35" fill="#FFE566" opacity="0.4"/>
  <circle cx="200" cy="60" r="22" fill="#FFE566" opacity="0.5"/>
</svg>
